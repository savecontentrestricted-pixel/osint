# OSINT Bot - Render config
# NOTE: User said NOT to deploy on Render yet, only GitHub. This file is for future.
services:
  - type: web
    name: osint-telegram-scraper
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: false  # User said manual later
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: ADMIN_ID
        sync: false
