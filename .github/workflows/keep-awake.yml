name: keep-awake
# Render FREE tier15 min quiet → spin-down → cold start (40-60s "slow").
# Ye EXTERNAL ping dono services ko hamesha warm rakhta hai.
on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm bot + gateway (external IPs — Render counts these)
        run: |
          for u in \
            https://osint-hunter-hub-bot.onrender.com/health \
            https://utility-api-vu83.onrender.com/health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$u" || true)
            echo "$u -> $code"
          done
