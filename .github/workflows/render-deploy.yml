# Auto-Deploy: push hote hi Render par naya version live ho jata hai
# (pehle koi webhook nahi tha, isliye naya code deploy nahi hota tha)
name: render-auto-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'      # workflow file change = bot code same, deploy bekaar
      - '*.md'
      - 'pella.json'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (skip if one is already running)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e
          SID=srv-db6jiubl550s73b7k8d0
          API="https://api.render.com/v1/services/$SID"
          LATEST=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" "$API/deploys?limit=1")
          STATUS=$(echo "$LATEST" | jq -r '.[0].deploy.status')
          COMMIT=$(echo "$LATEST" | jq -r '.[0].deploy.commit.id' | cut -c1-7)
          echo "Latest deploy: $STATUS | commit: $COMMIT | is push: ${GITHUB_SHA:0:7}"
          case "$STATUS" in
            build_in_progress|update_in_progress|created|queued)
              echo "Deploy already running - skipping to avoid churn."; exit 0;;
          esac
          if [ "$COMMIT" = "${GITHUB_SHA:0:7}" ]; then
            echo "Is commit ka deploy already ho chuka/chal raha hai - skipping."; exit 0
          fi
          # Render ka API kabhi kabhi 500 deta hai — 3 baar try karo (60s gap)
          for attempt in 1 2 3; do
            CODE=$(curl -sS -o /tmp/deploy_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}' "$API/deploys" || echo 000)
            if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
              echo "Render deploy triggered (attempt $attempt) for ${GITHUB_SHA:0:7} ✅"
              cat /tmp/deploy_resp.json | head -c 300
              exit 0
            fi
            echo "Attempt $attempt failed (HTTP $CODE): $(head -c 200 /tmp/deploy_resp.json 2>/dev/null)"
            [ "$attempt" = "3" ] && exit 1 || sleep 60
          done
