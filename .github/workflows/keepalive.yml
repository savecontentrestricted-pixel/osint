# Keepalive: har 5 min bot 2 + API hub ko ping karta hai
# (Render free 15 min me so jata hai; ye pings use jagaye rakhte hain)
name: keepalive-ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OSINT bot + API hub
        run: |
          curl -fsS --max-time 30 https://osint-hunter-hub-bot.onrender.com/ping || true
          curl -fsS --max-time 30 https://utility-api-vu83.onrender.com/health || true
          echo "dono ping ho gaye ✅"
