services:
  - type: web
    name: terabox-api-hub
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: ADMIN_KEY
        value: himanshu123
      - key: DEMO_KEY
        value: 1week
      - key: UPSTREAM_KEY
        value: 1week
